[project]
name = "bridge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vilayat-Ali", email = "vilayatcodemysite@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "airsim>=1.8.1",
]

[tool.uv.extra-build-dependencies]
airsim = ["numpy", "msgpack-rpc-python", "backports.ssl_match_hostname"]

[project.scripts]
bridge = "bridge:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
